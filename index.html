<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Epic 무료 에셋 라이브러리</title>
<meta name="description" content="에픽게임즈가 무료로 공개한 언리얼 엔진 리소스를 찾고 Fab 원본으로 바로 이동하는 라이브러리">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- 왼쪽: 목록 -->
  <aside class="side" id="side" aria-label="에셋 목록">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>EPIC FREE LIBRARY</span>
      <button class="icon-btn only-mobile" id="closeSide" aria-label="목록 닫기">✕</button>
    </div>
    <div class="nav-row">
      <button class="btn" id="prev">← 이전</button>
      <button class="btn" id="next">다음 →</button>
    </div>
    <label class="search" for="q">
      <span aria-hidden="true">⌕</span>
      <input id="q" type="search" placeholder="에셋·이펙트 이름, 설명 검색" autocomplete="off">
    </label>
    <div class="seg" role="group" aria-label="검색 범위">
      <button id="scopeAll" aria-pressed="true">전체</button>
      <button id="scopeCur" aria-pressed="false">현재 항목</button>
    </div>
    <select id="cat" class="sel" aria-label="분류"></select>
    <div class="count" id="count"></div>
    <ol class="list" id="list"></ol>
  </aside>

  <!-- 가운데: 상세 -->
  <main class="main" id="main">
    <div class="topbar only-mobile">
      <button class="btn" id="openSide">☰ 목록</button>
      <span class="topbar-title" id="topTitle"></span>
    </div>
    <div id="notice"></div>
    <section class="hero" id="hero" aria-live="polite"></section>
    <section class="effects">
      <div class="section-head">
        <h2 id="effectsTitle">EFFECTS</h2>
        <span class="section-meta" id="effectsMeta"></span>
      </div>
      <div class="effect-grid" id="effects"></div>
    </section>
    <footer class="foot" id="foot"></footer>
  </main>

  <!-- 오른쪽: 재생 속도 -->
  <aside class="rail" aria-label="미리보기 속도">
    <div class="rail-title">미리보기 속도<small>영상 파일은 그대로</small></div>
    <output class="speed-now" id="speedNow" for="speedRange">1x</output>
    <div class="speed-btns" id="speedBtns"></div>
    <input type="range" id="speedRange" min="0.1" max="2" step="0.05" value="1" aria-label="재생 속도">
  </aside>

</div>
<script src="app.js"></script>
</body>
</html>
